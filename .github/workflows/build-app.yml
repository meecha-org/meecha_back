name: Build App Container

on:
  push:
    branches: [ "develop" ]
    paths:
      'app/**'
jobs:
  build-app:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build meecha app Docker image
        run:  docker build --push --tag ghcr.io/${{ github.repository }}/meecha-app ./app
