name: Build Update Config

on:
  push:
    branches: [ "test-env" ]

jobs:
  build-update-config:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Update Config
        run: |
          date > generated.txt
          git config user.name  "test"
          git config user.email "test@mattuu.com"
          git add .
          git commit -m "generated"
          git push