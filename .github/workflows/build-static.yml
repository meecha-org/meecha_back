name: Build Static Container

on:
  push:
    branches: [ "develop" ]
    paths:
      - 'nginx/**'
      - '.github/workflows/**'

jobs:
  build-location:
    runs-on: self-hosted
    timeout-minutes: 3

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build the Docker image
        run:  docker build --push --tag ghcr.io/${{ github.repository }}/meecha-static:${{ github.sha }} ./nginx
