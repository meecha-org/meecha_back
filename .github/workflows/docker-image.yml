name: Docker Image CI

on:
  push:
    branches: [ "develop" ]

jobs:
  build-app:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the Docker image
        run:  docker buildx build --push --tag ghcr.io/${{ github.repository }}/meecha-app --platform linux/amd64,linux/arm64 ./app

  build-location:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the Docker image
        run:  docker buildx build --push --tag ghcr.io/${{ github.repository }}/meecha-location --platform linux/amd64,linux/arm64 ./location